<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Nicewise Textile</title>
    <script type="application/ld+json" id="faqSchema"></script>
    <style>
        :root {
            --primary-color: #2c5282;
            --text-dark: #2d3748;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text-dark); line-height: 1.6; background: #fff; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        nav { padding: 20px 0; border-bottom: 1px solid var(--border); background: white; }
        .back-link { text-decoration: none; color: var(--primary-color); font-weight: 600; font-size: 0.9em; }

        /* Top Overview Section */
        .product-header { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; padding: 40px 0; border-bottom: 1px solid var(--border); }
        .main-gallery { width: 100%; }
        .main-img { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

        .info-panel h1 { font-size: 2.2em; margin-bottom: 10px; color: var(--primary-color); }
        .sku { color: var(--text-light); font-size: 1.1em; margin-bottom: 25px; }
        
        .specs-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        .specs-table td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95em; }
        .spec-label { font-weight: 600; width: 130px; color: var(--text-light); }
        .product-desc { color: var(--text-light); font-size: 1em; margin-bottom: 25px; }

        /* Extended Visuals Section (Vertical Flow) */
        .extended-visuals { padding: 50px 0; display: flex; flex-direction: column; gap: 40px; background: var(--bg-light); margin: 40px 0; border-radius: 20px; }
        .visual-container { text-align: center; width: 100%; padding: 0 40px; }
        .visual-title { font-size: 1.2em; font-weight: 600; margin-bottom: 20px; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px; }
        .large-visual-img { width: 100%; max-width: 900px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* FAQ Section */
        .section-title { font-size: 1.6em; margin: 40px 0 25px; padding-bottom: 10px; border-bottom: 3px solid var(--primary-color); display: inline-block; }
        .faq-item { margin-bottom: 20px; background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .faq-q { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; font-size: 1.1em; }
        .faq-a { font-size: 1em; color: var(--text-dark); }

        .cta-box { background: var(--primary-color); color: white; padding: 40px; border-radius: 20px; text-align: center; margin-top: 50px; }
        .cta-btn { display: inline-block; background: white; color: var(--primary-color); padding: 14px 50px; border-radius: 35px; text-decoration: none; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        @media (max-width: 768px) {
            .product-header { grid-template-columns: 1fr; gap: 30px; }
            .visual-container { padding: 0 15px; }
            .info-panel h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="fabric-sourcing.html" class="back-link">← Back to Collection</a>
        </div>
    </nav>

    <div id="contentRoot">
        <div class="container" id="productDetail">
            <p style="padding: 100px; text-align: center;">Loading product masterpiece...</p>
        </div>
    </div>

    <footer style="padding: 60px 0; text-align: center; color: var(--text-light); font-size: 0.85em;">
        &copy; 2026 Nicewise Textile Solution. All rights reserved.
    </footer>

    <script>
        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { window.location.href = 'fabric-sourcing.html'; return; }

            try {
                const response = await fetch('data/fabrics.json?t=' + new Date().getTime());
                const fabrics = await response.json();
                const p = fabrics.find(f => f.id === id);

                if (!p) { document.getElementById('productDetail').innerHTML = 'Product not found.'; return; }

                document.title = `${p.id} - ${p.name} | Nicewise Textile`;

                // Render structure
                document.getElementById('productDetail').innerHTML = `
                    <!-- 1. Header Section -->
                    <div class="product-header">
                        <div class="main-gallery">
                            <img src="${p.image}" class="main-img" alt="${p.name}">
                        </div>
                        <div class="info-panel">
                            <h1>${p.name}</h1>
                            <div class="sku">Product Code: ${p.id}</div>
                            
                            <table class="specs-table">
                                <tr><td class="spec-label">Composition</td><td>${p.composition}</td></tr>
                                <tr><td class="spec-label">Width</td><td>${p.width}</td></tr>
                                <tr><td class="spec-label">Weight</td><td>${p.weight}</td></tr>
                                <tr><td class="spec-label">Usage</td><td>${p.application || 'Premium Apparel'}</td></tr>
                            </table>

                            <p class="product-desc">${p.description}</p>
                            
                            <div class="cta-box">
                                <h3>Sample & Quotation</h3>
                                <p>Get a fast quote and professional swatch kits</p>
                                <a href="https://wa.me/8613726225654?text=I%20am%20interested%20in%20${p.id}" class="cta-btn">WhatsApp Specialist</a>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Detailed Visuals Section (Vertical Big Images) -->
                    ${p.detail_img || p.color_card || p.design_img ? `
                        <div class="extended-visuals">
                            ${p.detail_img ? (Array.isArray(p.detail_img) ? p.detail_img : [p.detail_img]).map(img => `
                                <div class="visual-container">
                                    <h3 class="visual-title">Fabric Close-up Details</h3>
                                    <img src="${img}" class="large-visual-img" alt="Detail">
                                </div>
                            `).join('') : ''}
                            
                            ${p.color_card ? (Array.isArray(p.color_card) ? p.color_card : [p.color_card]).map(img => `
                                <div class="visual-container">
                                    <h3 class="visual-title">Available Color Palette</h3>
                                    <img src="${img}" class="large-visual-img" alt="Color Swatches">
                                </div>
                            `).join('') : ''}

                            ${p.design_img ? (Array.isArray(p.design_img) ? p.design_img : [p.design_img]).map(img => `
                                <div class="visual-container">
                                    <h3 class="visual-title">Garment Design Reference</h3>
                                    <img src="${img}" class="large-visual-img" alt="Design Layout">
                                </div>
                            `).join('') : ''}
                        </div>
                    ` : ''}

                    <!-- 3. FAQ Section -->
                    <div class="faq-section">
                        <h2 class="section-title">Common Questions</h2>
                        <div id="faqList">
                            ${(p.faqs || defaultFAQs(p)).map(faq => `
                                <div class="faq-item">
                                    <div class="faq-q">${faq.q}</div>
                                    <div class="faq-a">${faq.a}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                // AI Schema
                const faqs = p.faqs || defaultFAQs(p);
                document.getElementById('faqSchema').textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "FAQPage",
                    "mainEntity": faqs.map(f => ({
                        "@type": "Question",
                        "name": f.q,
                        "acceptedAnswer": { "@type": "Answer", "text": f.a }
                    }))
                });

            } catch (e) {
                console.error(e);
            }
        }

        function defaultFAQs(p) {
            return [
                { q: `What is the delivery time for ${p.id}?`, a: "Available stock ships within 3-5 days. Custom dyeing requires 15-20 days." },
                { q: "Do you provide international shipping?", a: "Yes, we ship globally via air and sea freight with full customs documentation." }
            ];
        }

        loadDetail();
    </script>
</body>
</html>
